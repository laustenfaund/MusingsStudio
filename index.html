<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musings Studio</title>
<meta name="description" content="Notes and card decks for Come, Follow Me Musings.">
<meta name="theme-color" content="#2A221B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musings">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel:wght@400;700&family=Raleway:ital,wght@0,400;0,700;1,400;1,700&family=Josefin+Sans:ital,wght@0,300;0,600;1,300;1,600&family=Great+Vibes&family=Special+Elite&display=swap">
<style>
:root{
  --bg:#F1F1EE; --surface:#FFFFFF; --surface2:#E7E6E1; --ink:#1C1B19; --muted:#67645D;
  --line:#D6D4CD; --accent:#86651C; --accent-ink:#FFFFFF; --accent-soft:#F1E7CF; --danger:#A3392A;
  --radius:10px; --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Cormorant Garamond", Georgia, serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --surface:#1D1C1A; --surface2:#292825; --ink:#ECEAE4; --muted:#A29E95;
    --line:#383631; --accent:#D3AC57; --accent-ink:#1B1406; --accent-soft:#3A301A; --danger:#E27461;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1D1C1A; --surface2:#292825; --ink:#ECEAE4; --muted:#A29E95;
  --line:#383631; --accent:#D3AC57; --accent-ink:#1B1406; --accent-soft:#3A301A; --danger:#E27461;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:15px/1.45 var(--ui); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
.app{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:12px 96px}
.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-block:6px 14px}
.brand{font-family:var(--display); font-weight:600; font-size:28px; letter-spacing:.01em; margin:0}
.brand em{font-weight:400; color:var(--muted)}
.store-note{font-size:12px; color:var(--muted)}
h2{font-size:17px; margin:0; font-weight:700}
h3{font-size:13px; margin:0; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:12px}
.btn{appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 13px; cursor:pointer; font-weight:500; line-height:1.2; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.field:focus-visible,.chip:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.btn.ghost{background:transparent; border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 9px; font-size:13px}
.btn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.btn:disabled{opacity:.45; cursor:default}
.field{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 11px}
textarea.field{resize:vertical; min-height:80px; line-height:1.45}
select.field{padding:8px 10px}
label.lbl{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px}

/* bottom nav */
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  display:flex; justify-content:center; gap:4px; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); z-index:20}
.nav button{flex:0 1 150px; border:0; background:transparent; padding:9px 6px; border-radius:8px; cursor:pointer; font-weight:600; color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink); background:var(--surface2)}

/* notes */
.compose{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:10px}
.compose textarea{border:0; padding:4px 2px; min-height:70px; background:transparent; font-size:16px}
.compose textarea:focus{outline:none}
.attach{position:relative; width:92px}
.attach img{width:92px; height:92px; object-fit:cover; border-radius:6px; display:block}
.notes{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:14px}
.note{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px}
.note .txt{white-space:pre-wrap; word-break:break-word; font-size:15px}
.note img{width:100%; max-height:240px; object-fit:cover; border-radius:6px; display:block}
.note .meta{font-size:12px; color:var(--muted)}
.note .acts{display:flex; gap:4px; flex-wrap:wrap; margin-top:auto}
.empty{padding:28px 8px; text-align:center; color:var(--muted)}

/* decks list */
.decks{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; margin-top:14px}
.deckcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column}
.deckcard .cover{background:var(--surface2); display:flex; justify-content:center; cursor:pointer; border:0; padding:0}
.deckcard .cover canvas{width:100%; height:auto; display:block}
.deckcard .info{padding:10px 12px; display:flex; flex-direction:column; gap:6px}
.deckcard .name{font-weight:600}

/* editor */
.deckbar{display:flex; gap:8px; align-items:center; margin-bottom:10px}
.deckname{flex:1; min-width:0; font-weight:600; font-size:17px; border:1px solid transparent; background:transparent; border-radius:8px; padding:7px 9px}
.deckname:hover,.deckname:focus{border-color:var(--line); background:var(--surface)}
.strip{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scroll-snap-type:x proximity}
.thumb{flex:0 0 auto; border:2px solid transparent; border-radius:8px; padding:0; background:var(--surface2); cursor:pointer; position:relative; scroll-snap-align:start}
.thumb canvas{display:block; width:78px; height:auto; border-radius:6px}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb .num{position:absolute; left:4px; top:3px; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7)}
.addcard{flex:0 0 78px; border:1px dashed var(--muted); border-radius:8px; background:transparent; cursor:pointer; color:var(--muted); font-weight:600; min-height:97px}
.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
@media (min-width:900px){ .cardgrid{grid-template-columns:repeat(5,minmax(0,1fr))} }
.tile{position:relative; padding:0; border:1px solid var(--line); border-radius:8px; background:var(--surface2); cursor:pointer; aspect-ratio:var(--ar); overflow:hidden; display:block; width:100%}
.tile canvas{display:block; width:100%; height:100%}
.tile:hover{border-color:var(--accent)}
.tile .num{position:absolute; left:7px; top:5px; font-size:12px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tile .emptylbl{position:absolute; inset:auto 0 45% 0; text-align:center; font-size:13px; color:rgba(255,255,255,.6); letter-spacing:.06em; text-transform:uppercase}
.addtile{background:transparent; border:1px dashed var(--muted); color:var(--muted); font-size:34px; font-weight:300}
.count{min-width:64px; text-align:center; font-weight:600; font-variant-numeric:tabular-nums}
.cardnav{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-variant-numeric:tabular-nums}
.editor{display:grid; grid-template-columns:1fr; gap:14px}
@media (min-width:900px){ .editor{grid-template-columns:minmax(0,1fr) 400px; align-items:start} .stagewrap{position:sticky; top:12px} }
.stagewrap{display:flex; flex-direction:column; gap:10px; align-items:center}
.stage canvas{display:block; width:min(100%, calc(60vh * var(--ar))); aspect-ratio:var(--ar); height:auto; border-radius:6px; touch-action:none; cursor:grab; box-shadow:0 1px 0 var(--line), 0 6px 24px rgba(0,0,0,.12); max-width:100%}
@media (min-width:900px){ .stage canvas{width:min(100%, calc(80vh * var(--ar)))} }
.nocard{padding:60px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius); width:100%}
.cardacts{justify-content:center}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:14px}
.tabs{display:flex; gap:4px; background:var(--surface2); padding:3px; border-radius:9px}
.tabs button{flex:1; border:0; background:transparent; padding:7px; border-radius:7px; font-weight:600; cursor:pointer; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 11px; cursor:pointer; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rng{display:grid; grid-template-columns:1fr 64px; gap:8px; align-items:center}
.rng input[type=range]{width:100%; accent-color:var(--accent)}
.rng input[type=number]{padding:6px 7px}
.swatches{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.sw{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0}
input[type=color]{width:40px; height:32px; border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:2px; cursor:pointer}
.divider{border:0; border-top:1px solid var(--line); margin:0}
.picknotes{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow:auto}
.picknote{border:1px solid var(--line); border-radius:8px; padding:9px; display:flex; gap:9px; align-items:flex-start}
.picknote img{width:56px; height:56px; object-fit:cover; border-radius:5px; flex:0 0 auto}
.picknote .txt{white-space:pre-wrap; font-size:14px; flex:1; min-width:0; word-break:break-word}

/* library */
.section{margin-top:22px; display:flex; flex-direction:column; gap:10px}
.items{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.item{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:10px; display:flex; gap:10px; align-items:center}
.item canvas{width:54px; height:auto; border-radius:4px; flex:0 0 auto}
.item .grow{flex:1; min-width:0}
.item .nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fontsample{font-size:22px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* sheets */
.overlay{position:fixed; inset:0; background:rgba(10,10,8,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center}
@media (min-width:700px){ .overlay{align-items:center} }
.sheet{background:var(--surface); width:100%; max-width:640px; max-height:88vh; border-radius:14px 14px 0 0; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){ .sheet{border-radius:14px} }
.sheethead{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line); gap:8px}
.sheetbody{padding:14px; overflow:auto; display:flex; flex-direction:column; gap:12px}
.choice{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:2px}
.choice:hover{border-color:var(--accent)}
.choice .sub{font-size:12px; color:var(--muted)}
.exportgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.exportgrid figure{margin:0; display:flex; flex-direction:column; gap:5px}
.exportgrid img{width:100%; border-radius:6px; display:block; border:1px solid var(--line)}
.exportgrid figcaption{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(78px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:9px; z-index:60; display:flex; gap:12px; align-items:center; max-width:calc(100% - 32px); font-size:14px}
.toast button{background:transparent; border:0; color:var(--bg); font-weight:700; text-decoration:underline; cursor:pointer}
.banner{background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:12px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
.sync{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 11px; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer}
.sync[data-state="synced"]{color:var(--ink)}
.sync[data-state="synced"]::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#5E9B5A; margin-right:6px; vertical-align:1px}
.sync[data-state="paused"],.sync[data-state="error"]{border-color:var(--accent); color:var(--ink)}
.dropping{outline:3px dashed var(--accent); outline-offset:3px}
.sort-ghost{opacity:.35}
.tile{touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.picknote[draggable="true"]{cursor:grab}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">Musings <em>studio</em></h1>
    <div class="row"><span class="store-note" id="storeNote"></span><button class="sync" id="syncChip" hidden data-drive="1">Sync</button></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<nav class="nav" aria-label="Sections">
  <button data-go="notes">Notes</button>
  <button data-go="decks">Decks</button>
  <button data-go="library">Library</button>
</nav>
<script src="config.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/Sortable.min.js"></script>
<script src="drive.js"></script>
<script src="app.js"></script>
</body>
</html>
